# Publishes the artifacts to Maven Central (Sonatype Central Portal).
#
# Trigger either by pushing a version tag:
#     git tag v0.1.1 && git push origin v0.1.1
# or manually from the Actions tab ("Run workflow") with an explicit version.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   CENTRAL_TOKEN_USERNAME  - Central Portal user token username (central.sonatype.com/usertoken)
#   CENTRAL_TOKEN_PASSWORD  - Central Portal user token password
#   GPG_PRIVATE_KEY         - ASCII-armored secret key: `gpg --armor --export-secret-keys <KEY_ID>`
#   GPG_PASSPHRASE          - passphrase for that key
#
# The `release` profile (in the root pom.xml) attaches sources+javadoc, GPG-signs,
# and uploads to the Portal with autoPublish=true, so no manual "Close & Release".

name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.1.1'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# `write` is needed to create the GitHub Release at the end of the job;
# the Maven Central upload itself only needs the secrets below.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # JDK 11: artifacts stay Java 8 bytecode (maven.compiler.target=1.8), while
      # every release plugin (javadoc, gpg, central-publishing) runs cleanly.
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Resolve release version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          # Central rejects SNAPSHOTs, but it does so only after the build has
          # run; fail here instead so a mistyped tag costs seconds, not minutes.
          case "${version}" in
            *-SNAPSHOT) echo "::error::Refusing to release a SNAPSHOT version: ${version}"; exit 1 ;;
            '')         echo "::error::Could not resolve a version to release"; exit 1 ;;
          esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing version ${version}"

      - name: Set project version
        run: mvn -B versions:set -DnewVersion=${{ steps.v.outputs.version }} -DgenerateBackupPoms=false

      - name: Publish to Maven Central
        run: mvn -B -Prelease clean deploy
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      # Only for tag pushes: a workflow_dispatch run has no tag to hang a
      # release off. Runs after the upload, so a failed publish never leaves a
      # GitHub Release advertising a version that is not on Central.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

      # The version lives in the tag, not in master's pom, so the README is the
      # only place on master that records what was released. Checked out
      # separately because the job itself is sitting on the tag.
      - name: Check out master
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@v5
        with:
          ref: master
          path: .master

      # Last on purpose: least critical step, so if it fails the release itself
      # is still intact and the README can be corrected by hand.
      - name: Point README at the released version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: .master
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          # Scoped to the dependency snippets. A repository-wide substitution
          # would also rewrite the `git tag vX.Y.Z` example further down, which
          # is illustrative and must not track the current version.
          sed -i -E "/^## Getting started/,/^## Configuration example/ s/[0-9]+\.[0-9]+\.[0-9]+/${VERSION}/g" README.md

          if git diff --quiet README.md; then
            echo "README already points at ${VERSION}"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "docs: point README at ${VERSION}"
          git push origin master
          echo "README updated to ${VERSION}"
