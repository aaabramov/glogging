# Checks the commit messages on a pull request.
#
# The .githooks/commit-msg hook only runs for someone who has opted into it with
# `git config core.hooksPath .githooks`, so it cannot bind a contributor. This job
# is the enforcement: it runs the very same hook script over every commit the PR
# adds, so the pattern list has exactly one home and the two can never drift.

name: Commit messages

on:
  pull_request:
    branches: [ master ]

# Least privilege: reads the tree and nothing else.
permissions:
  contents: read

jobs:
  attribution:
    runs-on: ubuntu-latest
    name: No AI attribution

    steps:
      # Full history: the job needs both endpoints of the PR range, and the
      # default shallow fetch has neither.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reject AI attribution in commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu

          # Name every commit examined. A green check over an *empty* range looks
          # identical to a green check that inspected everything, so the count is
          # the only thing distinguishing "clean" from "silently checked nothing".
          revs=$(git rev-list "${BASE_SHA}..${HEAD_SHA}")
          count=$(printf '%s' "$revs" | grep -c . || true)
          echo "Checking $count commit(s) in ${BASE_SHA}..${HEAD_SHA}"

          if [ "$count" -eq 0 ]; then
            echo "No commits in range - the range endpoints are wrong." >&2
            exit 1
          fi

          failed=0
          for sha in $revs; do
            git log -1 --format=%B "$sha" > commit-message.txt
            if .githooks/commit-msg commit-message.txt; then
              echo "  ok    $(git log -1 --format='%h %s' "$sha")"
            else
              echo "  ...in commit $sha ($(git log -1 --format=%s "$sha"))" >&2
              failed=1
            fi
          done
          rm -f commit-message.txt

          if [ "$failed" -ne 0 ]; then
            echo >&2
            echo "Rewrite the offending messages (git rebase -i) and force-push." >&2
            exit 1
          fi

          echo "All $count commit message(s) are clean."
