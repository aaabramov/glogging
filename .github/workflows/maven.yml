# Builds and tests the project with Maven across the supported JDK range.
# See: https://docs.github.com/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8 is the compile target (maven.compiler.source/target); the newer
        # LTS releases guard against JDK-specific regressions.
        java: [ '8', '11', '17', '21' ]

    name: JDK ${{ matrix.java }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn -B verify --file pom.xml
